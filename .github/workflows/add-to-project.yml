name: Add issues to the board

# Puts every new issue on the "midnite apps" project board, where the per-app views pick it up
# by its `app:` label.
#
# This is the *optional* half of board automation. The board is user-owned, which is outside this
# repository, and the built-in GITHUB_TOKEN cannot write to it — so this job stays dormant until
# both a PROJECT_URL variable and a PROJECTS_TOKEN secret exist. If you'd rather not mint a PAT,
# enable the board's own built-in "Auto-add to project" workflow instead (Project → ⋯ → Workflows)
# and leave this disabled; see docs/adding-an-app.md.

on:
  issues:
    types: [opened, reopened, transferred]

jobs:
  add:
    runs-on: ubuntu-latest
    if: ${{ vars.PROJECT_URL != '' && secrets.PROJECTS_TOKEN != '' }}
    steps:
      - uses: actions/add-to-project@v1
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECTS_TOKEN }}
